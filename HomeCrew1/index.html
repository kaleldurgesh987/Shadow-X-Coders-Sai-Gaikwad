    <script>
      (function() {
        var RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('vite-hmr') !== -1)) {
              return {
                binaryType: 'blob',
                readyState: 3,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url),
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                send: function() {},
                close: function() {},
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = RealWebSocket.CONNECTING;
          window.WebSocket.OPEN = RealWebSocket.OPEN;
          window.WebSocket.CLOSING = RealWebSocket.CLOSING;
          window.WebSocket.CLOSED = RealWebSocket.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason || event);
          var msg = (reason && reason.message) || String(reason || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
